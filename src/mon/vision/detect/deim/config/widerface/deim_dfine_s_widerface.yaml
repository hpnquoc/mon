# Basic
root        : ~                                                                 # Root directory of the current run.
arch        : "deim"                                                            # Model architecture or family (e.g., resnet).
model       : &model "deim_dfine_s"                                             # Model name (e.g., resnet50).
data        : &data "widerface"                                                 # Dataset name (e.g., cifar10) or directory (e.g., data/cifar10).
fullname    : &fullname "deim_dfine_s_widerface"                                # Full name of the current run (e.g., resnet50_cifar10_01). If not set, it will be this file's name.
save_dir    : &save_dir ~                                                       # Saving directory. If not set, it will be `root/arch/model/data`.
weights     : &weights "run/train/deim/deim_dfine_s/deim_dfine_s_widerface/best_stg2.pth"  # Path to the pretrained weights.
device      : cuda:0,1,2,3                                                      # Running device (i.e., cuda:0 | cuda:0,1,2,3 | cpu).
torchrun    : True                                                              # If ``True``, use torch.distributed.run to run the training script.
master_port : 7777                                                              # Master port for distributed training.
master_addr : "localhost"                                                       # Master address for distributed training.
local_rank  : -1                                                                # Local rank for distributed training.
epochs      : &epochs 100                                                       # Training epochs.
steps       : &steps ~                                                          # Training steps.
seed        : 0                                                                 # Random seed.
batch_size  : &batch_size 1                                                     # Batch size for prediction.
imgsz       : &imgsz 640                                                        # Image size for the model.
resize      : False                                                             # Resize the input image to `imgsz`.
benchmark   : False                                                             # Benchmark the model.
save_result : True                                                              # Save the result of the model.
save_image  : True                                                              # Save the output image.
save_debug  : &save_debug True                                                  # Save the debug information.
use_fullname: True                                                              # Use the full name for the save_dir.
keep_subdirs: False                                                             # Keep subdirectories in the save_dir.
save_nearby : False                                                             # Save outputs nearby the source.
exist_ok    : True                                                              # If ``False``, it will delete the save directory if it already exists.
verbose     : &verbose True                                                     # Verbosity.

# Misc
cfg_path    : "deim_dfine/coco80/deim_hgnetv2_s_coco80.yaml"                    # Fine-tuning from COCO80 pre-trained weights.
resume      : "run/train/deim/deim_dfine_s/deim_dfine_s_widerface/best_stg1.pth"    # Resume from checkpoint
tuning      : "zoo/vision/detect/deim/deim_dfine_s/coco80/deim_dfine_s_coco80.pth"  # Fine-tuning from checkpoint
test_only   : False                                                             # Test only.
print_method: "builtin"                                                         # Print method.
print_rank  : 0                                                                 # Print rank ID.
dtype       : &dtype "float32"                                                  # Data type for the model.
check       : True                                                              # Check the model when exporting.
simplify    : False                                                             # Simplify the model when exporting.
conf_thres  : 0.25                                                              # Confidence threshold for detection.

# Update the configurations (customized training).
update_cfg:
  # File: deim_hgnetv2_m_coco80.yaml
  __include__: [
    "./dfine_hgnetv2_s_coco80.yaml",
    "../../dataset/widerface_detection.yaml",
    "../../base/dataloader.yaml",
    "../../base/dfine_hgnetv2.yaml",
    "../../base/deim.yaml"
  ]

  epoches: *epochs  # Training epochs.

  # File: runtime.yaml
  use_amp: False                                                                # Use automatic mixed precision (AMP) for training.

  # File: dfine_hgnetv2.yaml
  eval_spatial_size: [*imgsz, *imgsz]  # h w

  PostProcessor:
    num_top_queries: 300                                                        # max_dets

  # File: dataloader.yaml
  train_dataloader:
    dataset:
      transforms:
        # File: deim.yaml
        ops:
          - { type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [ 0.1, 0.1 ], scaling_range: [ 0.5, 1.5 ],
              probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True }
          - { type: RandomPhotometricDistort, p: 0.5 }
          - { type: RandomZoomOut, fill: 0 }
          - { type: RandomIoUCrop, p: 0.8 }
          - { type: SanitizeBoundingBoxes, min_size: 1 }
          - { type: RandomHorizontalFlip }
          - { type: Resize, size: [ *imgsz, *imgsz ], }
          - { type: SanitizeBoundingBoxes, min_size: 1 }
          - { type: ConvertPILImage, dtype: *dtype, scale: True }
          - { type: ConvertBoxes, fmt: "cxcywh", normalize: True }

    collate_fn:
      base_size: *imgsz

    total_batch_size: 4  # total batch size equals to 32 (4 * 8)

  val_dataloader:
    dataset:
      transforms:
        ops:
          - { type: Resize, size: [ *imgsz, *imgsz ], }
          - { type: ConvertPILImage, dtype: *dtype, scale: True }
    total_batch_size: 4
